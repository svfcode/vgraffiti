<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vgraffiti</title>
    <link rel="stylesheet" href="./popup/style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>vgraffiti</h1>

      <section id="panelAuthed" class="panel" hidden>
        <p id="authedSummary" class="muted"></p>
        <p class="authed-profile-row">
          <a
            id="profileSiteLink"
            class="profile-site-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            >Мои рисунки на сайте</a>
        </p>
        <button id="btnLogout" type="button">Выйти</button>
      </section>

      <section id="panelGuest" class="panel">
        <p class="muted small">
          Войдите в аккаунт на сайте — расширение подхватит сессию автоматически.
        </p>
        <p class="guest-login-row">
          <a id="loginLink" class="login-site-link" href="#" target="_blank" rel="noopener noreferrer"
            >Войти на vgraffiti.ru</a>
        </p>
        <button id="btnSyncLogin" type="button">Проверить вход</button>
        <p class="muted small guest-hint">
          Откройте сайт в этой же вкладке браузера, войдите, затем нажмите «Проверить вход».
        </p>
      </section>

      <p id="err" class="err" hidden></p>
    </main>
    <script type="module" src="./popup/main.ts"></script>
  </body>
</html>
