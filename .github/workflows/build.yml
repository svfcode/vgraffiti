name: Build extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Zip
        run: npm run zip

      - name: Upload unpacked build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3/
          retention-days: 30

      - name: Upload zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vgraffiti-chrome-zip
          path: .output/*-chrome.zip
          retention-days: 30
