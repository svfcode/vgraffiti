name: Build extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package extension
        if: github.event_name != 'pull_request'
        run: |
          cp -r .output/chrome-mv3 vgraffiti-extension
          zip -r vgraffiti-extension.zip vgraffiti-extension
          unzip -l vgraffiti-extension.zip | head -20

      - name: Upload extension
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vgraffiti-extension
          path: vgraffiti-extension/
          retention-days: 30

      - name: Upload extension zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vgraffiti-extension-zip
          path: vgraffiti-extension.zip
          retention-days: 30
