name: Build extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package flat zip
        run: |
          cd .output/chrome-mv3
          zip -r ../vgraffiti-extension.zip .
          unzip -l ../vgraffiti-extension.zip | head -15

      - name: Upload extension zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vgraffiti-extension
          path: .output/vgraffiti-extension.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: vgraffiti extension (build ${{ github.run_number }})
          body: |
            Сборка расширения из main.

            **Установка:** скачайте `vgraffiti-extension.zip` → распакуйте → в выбранной папке должен лежать `manifest.json` (не в подпапке) → «Загрузить распакованное» в браузере.
          files: .output/vgraffiti-extension.zip
          make_latest: true
          prerelease: true
