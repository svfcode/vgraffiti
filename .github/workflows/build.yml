name: Build extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package flat zip
        run: |
          cd .output/chrome-mv3
          zip -r ../vgraffiti-extension.zip .
          unzip -l ../vgraffiti-extension.zip | head -15

      - name: Upload extension zip
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vgraffiti-extension
          path: .output/vgraffiti-extension.zip
          retention-days: 30
