<div class="bar-head">
  <span class="drag-handle" id="vgf-drag" title="Переместить панель">⡇</span>
  <details class="more" id="vgf-more">
    <summary class="more-btn" title="Настройки панели" aria-label="Настройки">⋯</summary>
    <div class="more-panel">
      <label class="more-opacity" title="Непрозрачность панели инструментов">
        Прозрачность панели
        <input type="range" id="vgf-panel-opacity" min="25" max="100" value="100" step="5" />
      </label>
      <button type="button" id="vgf-clear" title="Очистить рисунок">Очистить</button>
    </div>
  </details>
</div>
<div class="history-row">
  <button type="button" class="hist-btn" id="vgf-undo" title="Отменить (Ctrl+Z)">↶</button>
  <button type="button" class="hist-btn" id="vgf-redo" title="Повторить (Ctrl+Shift+Z)">↷</button>
</div>
<div class="tools">
  <button type="button" class="tool on" data-tool="brush" title="Кисть"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37-1.34-1.34a1 1 0 0 0-1.41 0L9 12.25 11.75 15l8.96-8.96a1 1 0 0 0 0-1.41z"/></svg></button>
  <button type="button" class="tool" data-tool="eraser" title="Ластик"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.24 3.56l4.2 4.2c.78.78.78 2.05 0 2.83L12 19.07l-6.3-6.3c-.78-.78-.78-2.05 0-2.83l7.07-7.07c.39-.39 1.02-.39 1.41 0l2.12 2.12z"/><path d="M2.81 16.09L7.91 21.19 4.93 19.07 2.81 16.09z"/></svg></button>
  <button type="button" class="tool" data-tool="arrow" title="Стрелка">↗</button>
  <button type="button" class="tool" data-tool="square" title="Квадрат">▢</button>
</div>
<div id="vgf-brush-size-wrap" class="row-size">
  <label title="Толщина кисти, стрелки и квадрата">Размер кисти <input type="range" id="vgf-brush-size" min="2" max="72" value="16" /></label>
</div>
<div id="vgf-eraser-size-wrap" class="row-size" hidden>
  <label title="Толщина ластика">Размер ластика <input type="range" id="vgf-eraser-size" min="2" max="96" value="24" /></label>
</div>
<div class="color-row">
  <div class="dual-color">
    <button type="button" class="dc-bg" id="vgf-dc-bg" aria-label="Задний цвет"></button>
    <button type="button" class="dc-fg" id="vgf-dc-fg" aria-label="Передний цвет кисти"></button>
  </div>
  <button type="button" class="swap-colors-btn" id="vgf-swap-colors" title="Поменять цвета (Ctrl+X)" aria-label="Поменять цвета">⇄</button>
</div>
<div id="vgf-swatches-wrap" class="swatches-wrap" hidden data-pick="fg">
  <p class="pick-hint" id="vgf-pick-hint">Передний цвет</p>
  <div class="swatches" id="vgf-swatches"></div>
</div>
